<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe | Friendly Game</title>

    <!-- #STYLE LINK -->
    <link rel="stylesheet" href="style.css">
    
    <!-- #GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Italianno&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rouge+Script&display=swap"
    rel="stylesheet">
    
    
    <!-- #SCRIPT LINK -->
    <script src="script.js" defer></script>
    
</head>

<body>

    <div class="game-container">

        <div class="container">
            <div class="box"> <span class="boxtext"></span> </div>
            <div class="box"> <span class="boxtext"></span> </div>
            <div class="box"> <span class="boxtext"></span> </div>
            <div class="box"> <span class="boxtext"></span> </div>
            <div class="box"> <span class="boxtext"></span> </div>
            <div class="box"> <span class="boxtext"></span> </div>
            <div class="box"> <span class="boxtext"></span> </div>
            <div class="box"> <span class="boxtext"></span> </div>
            <div class="box"> <span class="boxtext"></span> </div>
        </div>

        <div class="game-content">
            <h2 class="heading">Tik Tac Toe</h2>
            <div>
                <h4 class="sub-title turn">Turn for X</h4>
                <img src="./excited.gif" alt="Congratulations:" class="win-image">
                <button class="reset">Reset</button>
            </div>
        </div>

    </div>

</html>
